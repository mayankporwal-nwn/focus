name: Verify and Build FocusLock APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Pure Java behavior tests
        run: bash tests/run-core-tests.sh
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Android static lint
        run: gradle --no-daemon :app:lintDebug
      - name: Record SHA-256 checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee APK-SHA256.txt
      - name: Upload installable debug APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-Android-APK-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            APK-SHA256.txt
          if-no-files-found: error
